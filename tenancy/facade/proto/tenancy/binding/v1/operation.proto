syntax = "proto3";

package tenancy.binding.v1;

import "cell/placement/v1/reservation.proto";
import "tenancy/binding/v1/proof.proto";
import "tenancy/binding/v1/repair.proto";

// Messages in this file that a write set names as a proposed successor are
// governed by the ownership rule stated at the head of
// tenancy/binding/v1/serving_authority.proto: the store derives every value it
// owns and refuses a disagreeing proposal, and the scope is every owner-owned
// or store-derived value a proposal restates -- a field, a nested record or a
// whole row -- not a list.
//
// The refusal an adapter must raise is part of the rule and is restated here so
// this pointer is not half of it: ServingAuthorityStoreError
// PROPOSED_SUCCESSOR_MISMATCH on the serving-authority store, and
// BindingStoreError PROPOSED_SUCCESSOR_MISMATCH on the binding store.

enum BindingOperationStateV1 {
  BINDING_OPERATION_STATE_V1_UNSPECIFIED = 0;
  BINDING_OPERATION_STATE_V1_ACCEPTED = 1;
  BINDING_OPERATION_STATE_V1_VALIDATING = 2;
  BINDING_OPERATION_STATE_V1_QUEUED = 3;
  BINDING_OPERATION_STATE_V1_RUNNING = 4;
  BINDING_OPERATION_STATE_V1_WAITING_FOR_RECONCILER = 5;
  BINDING_OPERATION_STATE_V1_SUCCEEDED = 6;
  BINDING_OPERATION_STATE_V1_FAILED = 7;
  BINDING_OPERATION_STATE_V1_CANCEL_REQUESTED = 8;
  BINDING_OPERATION_STATE_V1_CANCELLED = 9;
  BINDING_OPERATION_STATE_V1_COMPENSATING = 10;
  BINDING_OPERATION_STATE_V1_ROLLED_BACK = 11;
}

enum BindingEffectBoundaryV1 {
  BINDING_EFFECT_BOUNDARY_V1_UNSPECIFIED = 0;
  BINDING_EFFECT_BOUNDARY_V1_NO_EFFECT = 1;
  BINDING_EFFECT_BOUNDARY_V1_RESERVATION_ARMED = 2;
  BINDING_EFFECT_BOUNDARY_V1_REVERSIBLE_PREPARATION = 3;
  BINDING_EFFECT_BOUNDARY_V1_WRITE_FENCE_COMMITTED_FORWARD_ONLY = 4;
  BINDING_EFFECT_BOUNDARY_V1_BINDING_COMMITTED = 5;
  BINDING_EFFECT_BOUNDARY_V1_CONVERGING = 6;
  BINDING_EFFECT_BOUNDARY_V1_SOURCE_AUTHORITY_ALLOCATED = 7;
  BINDING_EFFECT_BOUNDARY_V1_RELEASED = 8;
}

enum BindingCancellationDispositionV1 {
  BINDING_CANCELLATION_DISPOSITION_V1_UNSPECIFIED = 0;
  BINDING_CANCELLATION_DISPOSITION_V1_NOT_REQUESTED = 1;
  BINDING_CANCELLATION_DISPOSITION_V1_STOPPED_BEFORE_EFFECT = 2;
  BINDING_CANCELLATION_DISPOSITION_V1_COMPENSATING = 3;
  BINDING_CANCELLATION_DISPOSITION_V1_REFUSED_FORWARD_RECOVERY_REQUIRED = 4;
}

enum BindingRetryClassificationV1 {
  BINDING_RETRY_CLASSIFICATION_V1_UNSPECIFIED = 0;
  BINDING_RETRY_CLASSIFICATION_V1_TRANSIENT = 1;
  BINDING_RETRY_CLASSIFICATION_V1_BACKPRESSURE = 2;
  BINDING_RETRY_CLASSIFICATION_V1_DEPENDENCY = 3;
  BINDING_RETRY_CLASSIFICATION_V1_OPERATOR_REQUIRED = 4;
  BINDING_RETRY_CLASSIFICATION_V1_FORWARD_RECOVERY = 5;
}

message BindingRetryStatusV1 {
  uint32 attempt = 1;
  uint32 maximum_attempts = 2;
  BindingRetryClassificationV1 classification = 3;
  uint64 next_attempt_not_before_unix_seconds = 4;
}

message BindingOperationProgressV1 {
  uint64 prepared_participants = 1;
  uint64 required_participants = 2;
  uint64 copied_bytes = 3;
  uint64 total_bytes = 4;
  BindingDurableCheckpointV1 checkpoint = 5;
}

enum BindingCheckpointKindV1 {
  BINDING_CHECKPOINT_KIND_V1_UNSPECIFIED = 0;
  BINDING_CHECKPOINT_KIND_V1_RESERVATION_ARMED = 1;
  reserved 2;
  reserved "BINDING_CHECKPOINT_KIND_V1_PREPARATION";
  BINDING_CHECKPOINT_KIND_V1_MIGRATION_FENCE_CLAIMED = 3;
  BINDING_CHECKPOINT_KIND_V1_SOURCE_FENCED = 4;
  BINDING_CHECKPOINT_KIND_V1_BINDING_COMMITTED = 5;
  reserved 6;
  reserved "BINDING_CHECKPOINT_KIND_V1_CONVERGING";
  BINDING_CHECKPOINT_KIND_V1_ASSURANCE_COMPILED = 7;
  BINDING_CHECKPOINT_KIND_V1_PARTICIPANT_MANIFEST_COMMITTED = 8;
  BINDING_CHECKPOINT_KIND_V1_TRANSFER_AUTHORIZATION_SEALED = 9;
  BINDING_CHECKPOINT_KIND_V1_INITIAL_COPY_COMPLETED = 10;
  BINDING_CHECKPOINT_KIND_V1_PARTICIPANTS_PREPARED = 11;
  BINDING_CHECKPOINT_KIND_V1_SOURCE_FENCE_DIRECTIVES_ISSUED = 12;
  BINDING_CHECKPOINT_KIND_V1_FINAL_DELTA_APPLIED = 13;
  BINDING_CHECKPOINT_KIND_V1_TARGET_ACTIVATED = 14;
  BINDING_CHECKPOINT_KIND_V1_ROUTING_CONVERGED = 15;
  BINDING_CHECKPOINT_KIND_V1_SOURCE_RELEASED = 16;
  BINDING_CHECKPOINT_KIND_V1_WRITE_AUTHORITY_LEASE_PUBLISHED = 17;
}

message BindingDurableCheckpointV1 {
  BindingCheckpointKindV1 kind = 1;
  uint64 revision = 2;
  Digest32 checkpoint_digest = 3;
}

message BindingCommittedSuccessV1 {
  Digest32 binding_digest = 1;
  cell.placement.v1.SignedBindingOutcomeV1 reservation_outcome = 2;
}

message EmptyBindingResultV1 {}

message BindingOutcomeAbortedSuccessV1 {
  cell.placement.v1.SignedBindingOutcomeV1 reservation_outcome = 1;
}

message BindingOperationSuccessV1 {
  oneof result {
    BindingCommittedSuccessV1 binding_committed = 1;
    EmptyBindingResultV1 cancelled_before_effect = 2;
    BindingOutcomeAbortedSuccessV1 binding_outcome_aborted = 3;
    BindingRepairAppliedV1 repair_applied = 4;
    cell.placement.v1.SignedSourceReservationReleasePermitV1 migration_released = 5;
  }
}

enum BindingRefusalCodeV1 {
  BINDING_REFUSAL_CODE_V1_UNSPECIFIED = 0;
  BINDING_REFUSAL_CODE_V1_ALREADY_BOUND = 1;
  BINDING_REFUSAL_CODE_V1_NOT_FOUND_OR_NOT_AUTHORIZED = 2;
  BINDING_REFUSAL_CODE_V1_STALE_GENERATION = 3;
  BINDING_REFUSAL_CODE_V1_STALE_REVISION = 4;
  BINDING_REFUSAL_CODE_V1_SOURCE_CELL_MISMATCH = 5;
  BINDING_REFUSAL_CODE_V1_PLACEMENT_PROOF_REJECTED = 6;
  BINDING_REFUSAL_CODE_V1_RESERVATION_PERMIT_REJECTED = 7;
  BINDING_REFUSAL_CODE_V1_TRANSFER_AUTHORIZATION_REJECTED = 8;
  BINDING_REFUSAL_CODE_V1_WRITE_FENCE_REJECTED = 9;
  BINDING_REFUSAL_CODE_V1_MIGRATION_SEAL_REJECTED = 10;
  BINDING_REFUSAL_CODE_V1_IDEMPOTENCY_KEY_REUSE = 11;
  BINDING_REFUSAL_CODE_V1_CANCELLATION_UNSAFE = 12;
  BINDING_REFUSAL_CODE_V1_RESERVATION_ATTEMPT_REJECTED = 13;
  BINDING_REFUSAL_CODE_V1_WRITE_AUTHORITY_LEASE_REJECTED = 14;
  BINDING_REFUSAL_CODE_V1_WRITE_AUTHORITY_LEASE_FROZEN = 15;
}

enum BindingFailureCodeV1 {
  BINDING_FAILURE_CODE_V1_UNSPECIFIED = 0;
  BINDING_FAILURE_CODE_V1_DEPENDENCY_UNAVAILABLE = 1;
  BINDING_FAILURE_CODE_V1_INTEGRITY_FAILURE = 2;
  BINDING_FAILURE_CODE_V1_AUDIT_PERSISTENCE_FAILED = 3;
  BINDING_FAILURE_CODE_V1_PROJECTION_PERSISTENCE_FAILED = 4;
  BINDING_FAILURE_CODE_V1_DEADLINE_EXCEEDED = 5;
  BINDING_FAILURE_CODE_V1_FORWARD_RECOVERY_REQUIRED = 6;
  BINDING_FAILURE_CODE_V1_OPERATOR_INTERVENTION_REQUIRED = 7;
}

message BindingOperationTerminalV1 {
  oneof outcome {
    BindingOperationSuccessV1 success = 1;
    BindingRefusalCodeV1 refusal = 2;
    BindingFailureCodeV1 failure = 3;
  }
}

message BindingOperationV1 {
  BindingOperationKeyV1 key = 1;
  uint64 revision = 2;
  BindingOperationStateV1 state = 3;
  BindingEffectBoundaryV1 effect_boundary = 4;
  BindingCancellationDispositionV1 cancellation = 5;
  BindingRetryStatusV1 retry = 6;
  BindingOperationProgressV1 progress = 7;
  BindingOperationTerminalV1 terminal = 8;
  Digest32 record_digest = 9;
}
