syntax = "proto3";

package tenancy.binding.v1;

import "cell/placement/v1/reservation.proto";
import "tenancy/binding/v1/proof.proto";
import "tenancy/identity/v1/identity.proto";

enum SourceReservationReleaseIssuanceStatusV1 {
  SOURCE_RESERVATION_RELEASE_ISSUANCE_STATUS_V1_UNSPECIFIED = 0;
  SOURCE_RESERVATION_RELEASE_ISSUANCE_STATUS_V1_PENDING_SIGNATURE = 1;
  SOURCE_RESERVATION_RELEASE_ISSUANCE_STATUS_V1_PUBLISHED = 2;
}

message SourceReservationReleaseIssuanceRecordV1 {
  cell.placement.v1.SourceReservationReleaseIntentV1 intent = 1;
  SourceReservationReleaseIssuanceStatusV1 status = 2;
  cell.placement.v1.SignedSourceReservationReleasePermitV1 signed_permit = 3;
  uint64 revision = 4;
  Digest32 record_digest = 5;
}

message SourceReservationReleaseIssuancePreconditionV1 {
  uint64 revision = 1;
  SourceReservationReleaseIssuanceStatusV1 status = 2;
  Digest32 record_digest = 3;
}

message RequestSourceReleaseCommitContextV1 {}

message ReconciliationSourceReleaseCommitContextV1 {
  Digest32 candidate_digest = 1;
  uint64 lease_epoch = 2;
  Digest32 lease_digest = 3;
}

message SourceReleaseCommitContextV1 {
  oneof context {
    RequestSourceReleaseCommitContextV1 request = 1;
    ReconciliationSourceReleaseCommitContextV1 reconciliation = 2;
  }
}

// What an INDEPENDENT commit observer read for one source-reservation release
// issuance, by re-reading the committed row. Signed under
// BINDING_PROOF_DOMAIN_V1_SOURCE_RELEASE_COMMIT_OBSERVATION by the observer's
// own identity, never by the store that performed the commit.
message SourceReleaseCommitObservationV1 {
  uint32 schema_version = 1;
  tenancy.identity.v1.TenantId tenant_id = 2;
  BindingOperationKeyV1 operation = 3;
  uint64 successor_binding_generation = 4;
  uint64 successor_binding_revision = 5;
  Digest32 successor_binding_record_digest = 6;
  uint64 issuance_revision = 7;
  Digest32 issuance_record_digest = 8;
  Digest32 rollback_window_elapsed_digest = 9;
  SourceReleaseCommitContextV1 context = 10;
  Digest32 committed_transaction_digest = 11;
  // Read out of the durable record.
  uint64 committed_at_unix_seconds = 12;
  // When the observer itself looked.
  uint64 observed_at_unix_seconds = 13;
}

message SignedSourceReleaseCommitObservationV1 {
  SourceReleaseCommitObservationV1 payload = 1;
  BindingProofEnvelopeV1 envelope = 2;
  bytes signature = 3;
}
