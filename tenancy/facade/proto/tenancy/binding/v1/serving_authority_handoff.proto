syntax = "proto3";

package tenancy.binding.v1;

import "tenancy/binding/v1/serving_authority_retirement.proto";

import "tenancy/binding/v1/proof.proto";
import "tenancy/binding/v1/serving_authority.proto";
import "tenancy/binding/v1/serving_authority_installation.proto";
import "tenancy/binding/v1/serving_authority_freeze.proto";

// Messages in this file that a write set names as a proposed successor are
// governed by the ownership rule stated at the head of
// tenancy/binding/v1/serving_authority.proto: the store derives every value it
// owns and refuses a disagreeing proposal, and the scope is every owner-owned
// or store-derived value a proposal restates -- a field, a nested record or a
// whole row -- not a list.
// The refusal an adapter must raise is part of the rule and is restated here so
// this pointer is not half of it: ServingAuthorityStoreError
// PROPOSED_SUCCESSOR_MISMATCH on the serving-authority store, and
// BindingStoreError PROPOSED_SUCCESSOR_MISMATCH on the binding store.

message ServingAuthorityPotentiallyInstallableV1 {}

message ServingAuthorityTerminalFencedV1 {
  Digest32 closure_digest = 1;
}

message ServingAuthorityHandoffProgressV1 {
  oneof progress {
    ServingAuthorityPotentiallyInstallableV1 committed_potentially_installable = 1;
    SignedServingAuthorityInstallationResultV1 installed = 2;
    ServingAuthorityFreezeIntentV1 freeze_requested = 3;
    ServingAuthorityRetirementEvidenceV1 retired_awaiting_effect_fencing = 6;
    ServingAuthorityTerminalFencedV1 terminal_fenced = 5;
  }
  reserved 4;
  reserved "frozen_awaiting_effect_fencing";
}

message ServingAuthorityHandoffRecordV1 {
  TenantControlPartitionRefV1 control_partition = 1;
  ServingAuthorityInstallationIssuanceV1 issuance = 2;
  SignedServingAuthorityInstallGrantV1 signed_install_grant = 3;
  ServingAuthorityHandoffProgressV1 progress = 4;
  uint64 revision = 5;
  Digest32 record_digest = 6;
}

message ServingAuthorityHandoffPreconditionV1 {
  ServingAuthorityInstanceV1 instance = 1;
  Digest32 installation_issuance_digest = 2;
  uint64 revision = 3;
  Digest32 record_digest = 4;
}
