syntax = "proto3";

package tenancy.binding.v1;

import "tenancy/binding/v1/attempt.proto";
import "tenancy/binding/v1/operation.proto";
import "tenancy/binding/v1/proof.proto";
import "tenancy/binding/v1/serving_authority_handoff.proto";
import "tenancy/binding/v1/binding_control_partition.proto";
import "tenancy/binding/v1/transfer_execution.proto";
import "tenancy/binding/v1/source_release_issuance.proto";
import "tenancy/binding/v1/work_snapshot.proto";
import "tenancy/identity/v1/identity.proto";

enum BindingReconciliationWorkClassV1 {
  BINDING_RECONCILIATION_WORK_CLASS_V1_UNSPECIFIED = 0;
  BINDING_RECONCILIATION_WORK_CLASS_V1_UNSETTLED_RESERVATION_ATTEMPT = 1;
  BINDING_RECONCILIATION_WORK_CLASS_V1_FORWARD_ONLY_MIGRATION = 2;
  BINDING_RECONCILIATION_WORK_CLASS_V1_PENDING_PROJECTION_CONVERGENCE = 3;
  BINDING_RECONCILIATION_WORK_CLASS_V1_PENDING_SOURCE_RELEASE = 4;
  BINDING_RECONCILIATION_WORK_CLASS_V1_NONTERMINAL_OPERATION = 5;
  reserved 6;
  reserved "BINDING_RECONCILIATION_WORK_CLASS_V1_PENDING_WRITE_AUTHORITY_LEASE_PUBLICATION";
  BINDING_RECONCILIATION_WORK_CLASS_V1_PENDING_SERVING_AUTHORITY_HANDOFF = 9;
  BINDING_RECONCILIATION_WORK_CLASS_V1_PENDING_CONTROL_CONTRIBUTION_PROJECTION = 10;
  BINDING_RECONCILIATION_WORK_CLASS_V1_PENDING_TRANSFER_EXECUTION_SETTLEMENT = 7;
  BINDING_RECONCILIATION_WORK_CLASS_V1_PENDING_WORK_SNAPSHOT = 8;
}

message BindingReconciliationQueryV1 {
  string partition = 1;
  BindingReconciliationWorkClassV1 work_class = 2;
  uint64 changed_before_unix_seconds = 3;
  uint32 page_size = 4;
  bytes page_token = 5;
}

message ReservationAttemptReconciliationSubjectV1 {
  uint64 expected_revision = 1;
  BindingReservationAttemptV1 attempt = 2;
}

message BindingOperationReconciliationSubjectV1 {
  uint64 expected_revision = 1;
  BindingOperationV1 operation = 2;
}

message ServingAuthorityHandoffReconciliationSubjectV1 {
  uint64 expected_revision = 1;
  ServingAuthorityHandoffRecordV1 handoff = 2;
}

message TransferExecutionLedgerReconciliationSubjectV1 {
  uint64 expected_revision = 1;
  TransferExecutionLedgerV1 ledger = 2;
}

message SourceReleaseIssuanceReconciliationSubjectV1 {
  uint64 expected_revision = 1;
  SourceReservationReleaseIssuanceRecordV1 issuance = 2;
}

message WorkSnapshotReconciliationSubjectV1 {
  uint64 expected_revision = 1;
  BindingWorkSnapshotProgressV1 progress = 2;
}

message BindingReconciliationSubjectV1 {
  oneof subject {
    ReservationAttemptReconciliationSubjectV1 reservation_attempt = 1;
    BindingOperationReconciliationSubjectV1 operation = 2;
    ServingAuthorityHandoffReconciliationSubjectV1 serving_authority_handoff = 7;
    TransferExecutionLedgerReconciliationSubjectV1 transfer_execution_ledger = 4;
    SourceReleaseIssuanceReconciliationSubjectV1 source_release_issuance = 5;
    WorkSnapshotReconciliationSubjectV1 work_snapshot = 6;
    BindingControlContributionProjectionV1 control_contribution_projection = 8;
  }
  reserved 3;
  reserved "write_authority_lease_issuance";
}

message BindingReconciliationCandidateV1 {
  tenancy.identity.v1.TenantId tenant_id = 1;
  BindingOperationKeyV1 operation = 2;
  BindingReconciliationWorkClassV1 work_class = 3;
  BindingReconciliationSubjectV1 subject = 4;
  Digest32 durable_checkpoint_digest = 5;
  Digest32 candidate_digest = 6;
}

message BindingReconciliationPageV1 {
  repeated BindingReconciliationCandidateV1 candidates = 1;
  bytes next_page_token = 2;
}

message BindingReconciliationLeaseV1 {
  Digest32 candidate_digest = 1;
  string worker_id = 2;
  uint64 lease_epoch = 3;
  uint64 not_before_unix_seconds = 4;
  uint64 expires_at_unix_seconds = 5;
  Digest32 lease_digest = 6;
}

message CompleteBindingReconciliationV1 {
  Digest32 candidate_digest = 1;
  Digest32 lease_digest = 2;
  Digest32 applied_checkpoint_digest = 3;
  Digest32 result_digest = 4;
}
