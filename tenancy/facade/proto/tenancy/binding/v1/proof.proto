syntax = "proto3";

package tenancy.binding.v1;

import "tenancy/identity/v1/identity.proto";

message Digest32 {
  bytes value = 1;
}

message BindingProducerIdV1 {
  string value = 1;
}

message BindingKeyIdV1 {
  string value = 1;
}

message BindingProofNonceV1 {
  string value = 1;
}

message BindingOperationKeyV1 {
  tenancy.identity.v1.TenantId tenant_id = 1;
  string operation_id = 2;
}

enum BindingProofDomainV1 {
  BINDING_PROOF_DOMAIN_V1_UNSPECIFIED = 0;
  BINDING_PROOF_DOMAIN_V1_BINDING_INVOCATION = 1;
  BINDING_PROOF_DOMAIN_V1_RESIDENCY_TRANSFER_AUTHORIZATION = 2;
  BINDING_PROOF_DOMAIN_V1_WRITE_FENCE = 3;
  BINDING_PROOF_DOMAIN_V1_WRITE_AUTHORITY_TOKEN = 4;
  BINDING_PROOF_DOMAIN_V1_MIGRATION_COMMIT_SEAL = 5;
  BINDING_PROOF_DOMAIN_V1_REPAIR_AUTHORITY = 6;
  BINDING_PROOF_DOMAIN_V1_BINDING_PROJECTION = 7;
  BINDING_PROOF_DOMAIN_V1_RESIDENCY_TRANSFER_AUTHORIZATION_SET = 8;
  BINDING_PROOF_DOMAIN_V1_PARTICIPANT_MANIFEST = 9;
  BINDING_PROOF_DOMAIN_V1_PARTICIPANT_PREPARED_RECEIPT = 10;
  BINDING_PROOF_DOMAIN_V1_PARTICIPANT_SOURCE_FENCED_RECEIPT = 11;
  BINDING_PROOF_DOMAIN_V1_PARTICIPANT_TARGET_ACTIVATED_RECEIPT = 12;
  BINDING_PROOF_DOMAIN_V1_PARTICIPANT_SOURCE_RELEASED_RECEIPT = 13;
  BINDING_PROOF_DOMAIN_V1_PARTICIPANT_PHASE_CLOSURE = 14;
  BINDING_PROOF_DOMAIN_V1_TRANSFER_EFFECT_MANIFEST = 15;
  BINDING_PROOF_DOMAIN_V1_TRANSFER_EXECUTION_PERMIT = 16;
  BINDING_PROOF_DOMAIN_V1_TRANSFER_EXECUTION_OUTCOME = 17;
  BINDING_PROOF_DOMAIN_V1_PROJECTION_CONVERGENCE = 18;
  BINDING_PROOF_DOMAIN_V1_SOURCE_FENCE_DIRECTIVE = 19;
  BINDING_PROOF_DOMAIN_V1_RECOVERY_SOURCE_FENCE_COMPLETION = 20;
  BINDING_PROOF_DOMAIN_V1_WRITE_AUTHORITY_LEASE = 21;
  BINDING_PROOF_DOMAIN_V1_TENANT_BIRTH_RECORD = 22;
  BINDING_PROOF_DOMAIN_V1_WRITE_AUTHORITY_LEASE_COMMIT_ATTESTATION = 23;
  BINDING_PROOF_DOMAIN_V1_RECONCILIATION_INVOCATION = 24;
  BINDING_PROOF_DOMAIN_V1_ROLLBACK_WINDOW_ELAPSED = 25;
  BINDING_PROOF_DOMAIN_V1_SOURCE_RELEASE_COMMIT_ATTESTATION = 26;
  BINDING_PROOF_DOMAIN_V1_SERVING_AUTHORITY_INVOCATION = 27;
  BINDING_PROOF_DOMAIN_V1_SERVING_AUTHORITY_CONTROL_COMMIT_ATTESTATION = 28;
  BINDING_PROOF_DOMAIN_V1_SERVING_AUTHORITY_INSTALL_GRANT = 29;
  BINDING_PROOF_DOMAIN_V1_SERVING_AUTHORITY_FREEZE_GRANT = 30;
  BINDING_PROOF_DOMAIN_V1_SERVING_AUTHORITY_INSTALLATION_RESULT = 31;
  BINDING_PROOF_DOMAIN_V1_SERVING_AUTHORITY_FREEZE_RESULT = 32;
  BINDING_PROOF_DOMAIN_V1_SERVING_AUTHORITY_INDEPENDENT_RETIREMENT = 33;
  BINDING_PROOF_DOMAIN_V1_CONTROL_CONTRIBUTION_COMMIT = 34;
  BINDING_PROOF_DOMAIN_V1_CONTROL_CONTRIBUTION_HANDOFF = 35;
  BINDING_PROOF_DOMAIN_V1_CONTROL_CONTRIBUTION_ACKNOWLEDGMENT = 36;
}

message BindingProofEnvelopeV1 {
  uint32 schema_version = 1;
  uint32 signing_format_version = 2;
  BindingProofDomainV1 domain = 3;
  BindingProducerIdV1 producer = 4;
  BindingProducerIdV1 audience = 5;
  BindingKeyIdV1 key_id = 6;
  BindingProofNonceV1 nonce = 7;
  uint64 issued_at_unix_seconds = 8;
  uint64 expires_at_unix_seconds = 9;
  Digest32 payload_digest = 10;
}
