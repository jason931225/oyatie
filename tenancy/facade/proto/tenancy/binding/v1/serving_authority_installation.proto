syntax = "proto3";

package tenancy.binding.v1;

import "tenancy/binding/v1/proof.proto";
import "tenancy/binding/v1/serving_authority.proto";

// Messages in this file that a write set names as a proposed successor are
// governed by the ownership rule stated at the head of
// tenancy/binding/v1/serving_authority.proto: the store derives every value it
// owns and refuses a disagreeing proposal, and the scope is every owner-owned
// or store-derived value a proposal restates -- a field, a nested record or a
// whole row -- not a list.
//
// The refusal an adapter must raise is part of the rule and is restated here so
// this pointer is not half of it: ServingAuthorityStoreError
// PROPOSED_SUCCESSOR_MISMATCH on the serving-authority store, and
// BindingStoreError PROPOSED_SUCCESSOR_MISMATCH on the binding store.

message ServingAuthorityInstallationIssuanceV1 {
  TenantControlPartitionRefV1 control_partition = 1;
  ServingAuthorityInstanceV1 instance = 2;
  ServingAuthorityBusinessIdV1 business = 3;
  Digest32 participant_manifest_digest = 4;
  Digest32 previous_authority_closure_digest = 5;
  uint64 revision = 6;
  Digest32 record_digest = 7;
}

message ServingAuthorityControlCommitAttestationPayloadV1 {
  uint32 schema_version = 1;
  TenantControlPartitionRefV1 control_partition = 2;
  ServingAuthorityInstanceV1 instance = 3;
  ServingAuthorityBusinessIdV1 business = 4;
  Digest32 committed_binding_digest = 5;
  uint64 committed_issuance_revision = 6;
  Digest32 committed_issuance_digest = 7;
  Digest32 committed_transaction_digest = 8;
  uint64 committed_at_unix_seconds = 9;
}

message SignedServingAuthorityControlCommitAttestationV1 {
  ServingAuthorityControlCommitAttestationPayloadV1 payload = 1;
  BindingProofEnvelopeV1 envelope = 2;
  bytes signature = 3;
}

message CommittedServingAuthorityInstallationClaimV1 {
  ServingAuthorityInstallationIssuanceV1 issuance = 1;
  SignedServingAuthorityControlCommitAttestationV1 attestation = 2;
}

message ServingAuthorityInstallGrantPayloadV1 {
  uint32 schema_version = 1;
  CommittedServingAuthorityInstallationClaimV1 committed = 2;
}

message SignedServingAuthorityInstallGrantV1 {
  ServingAuthorityInstallGrantPayloadV1 payload = 1;
  BindingProofEnvelopeV1 envelope = 2;
  bytes signature = 3;
}

message ServingAuthorityInstallationResultPayloadV1 {
  uint32 schema_version = 1;
  ServingAuthorityInstanceV1 instance = 2;
  ServingAuthorityBusinessIdV1 business = 3;
  InstalledServingAuthorityV1 installed = 4;
  Digest32 first_lease_issuance_digest = 5;
  uint64 local_state_revision = 6;
  Digest32 committed_transaction_digest = 7;
  Digest32 result_digest = 8;
}

message SignedServingAuthorityInstallationResultV1 {
  ServingAuthorityInstallationResultPayloadV1 payload = 1;
  BindingProofEnvelopeV1 envelope = 2;
  bytes signature = 3;
}
