syntax = "proto3";

package tenancy.binding.v1;

import "tenancy/binding/v1/serving_authority_retirement.proto";

import "tenancy/binding/v1/proof.proto";
import "tenancy/binding/v1/serving_authority.proto";
import "cell/placement/v1/evidence.proto";

message ServingAuthoritySurvivingQuorumPayloadV1 {
  uint32 schema_version = 1;
  ServingAuthorityInstanceV1 instance = 2;
  uint64 committed_state_revision = 3;
  Digest32 committed_state_digest = 4;
  Digest32 rejection_high_water_digest = 5;
  cell.placement.v1.ImmutableEvidenceRefV1 quorum_evidence = 6;
}

message SignedServingAuthoritySurvivingQuorumV1 {
  ServingAuthoritySurvivingQuorumPayloadV1 payload = 1;
  BindingProofEnvelopeV1 envelope = 2;
  bytes signature = 3;
}

message ServingAuthoritySurvivingQuorumEvidenceV1 {
  SignedServingAuthoritySurvivingQuorumV1 attestation = 1;
}

message ServingAuthorityReplacementEvidenceV1 {
  ServingAuthorityInstanceV1 prior_instance = 1;
  ServingAuthorityInstanceV1 replacement_instance = 2;
  Digest32 prior_installation_issuance_digest = 3;
  Digest32 prior_effect_path_fencing_digest = 5;
  Digest32 recovery_authority_digest = 7;
  reserved 4, 6;
  reserved "independent_physical_fence", "prior_installation_rejection_digest";
  SignedServingAuthorityIndependentRetirementV1 independent_retirement = 8;
  Digest32 terminal_closure_digest = 9;
}

message ServingAuthorityFirstInstallationBasisV1 {
  ServingAuthoritySurvivingQuorumEvidenceV1 surviving_partition = 1;
  Digest32 uninstalled_precondition_digest = 2;
}

message ServingAuthorityRestoreBasisV1 {
  oneof basis {
    ServingAuthorityFirstInstallationBasisV1 first_installation = 1;
    ServingAuthoritySurvivingQuorumEvidenceV1 surviving_quorum = 2;
    ServingAuthorityReplacementEvidenceV1 independently_fenced_replacement = 3;
  }
}
