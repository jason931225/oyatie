syntax = "proto3";

package cell.placement.v1;

import "cell/placement/v1/drain.proto";
import "cell/placement/v1/lifecycle.proto";
import "cell/placement/v1/proof.proto";
import "cell/placement/v1/rebalance.proto";
import "cell/placement/v1/resource.proto";

// Messages in this file that a write set names as a proposed successor are
// governed by the ownership rule stated at the head of
// cell/placement/v1/movement_authority.proto: the store derives every value it
// owns and refuses a disagreeing proposal, and the scope is every owner-owned
// or store-derived value a proposal restates -- a field, a nested record or a
// whole row -- not a list.
//
// The refusal an adapter must raise is part of the rule and is restated here so
// this pointer is not half of it: PlacementContractError CONFLICT on the store
// that owns the row.

message CellControlOperationKeyV1 {
  CellControlSubjectV1 subject = 1;
  string operation_id = 2;
}

enum CellControlOperationKindV1 {
  CELL_CONTROL_OPERATION_KIND_V1_UNSPECIFIED = 0;
  CELL_CONTROL_OPERATION_KIND_V1_CREATE_CELL = 1;
  CELL_CONTROL_OPERATION_KIND_V1_UPDATE_CELL = 2;
  CELL_CONTROL_OPERATION_KIND_V1_MUTATE_READINESS = 3;
  CELL_CONTROL_OPERATION_KIND_V1_DRAIN_CELL = 4;
  CELL_CONTROL_OPERATION_KIND_V1_DECOMMISSION_CELL = 5;
  CELL_CONTROL_OPERATION_KIND_V1_REBALANCE = 6;
  CELL_CONTROL_OPERATION_KIND_V1_REPAIR = 7;
}

enum CellControlOperationStateV1 {
  CELL_CONTROL_OPERATION_STATE_V1_UNSPECIFIED = 0;
  CELL_CONTROL_OPERATION_STATE_V1_PENDING = 1;
  CELL_CONTROL_OPERATION_STATE_V1_RUNNING = 2;
  CELL_CONTROL_OPERATION_STATE_V1_SUCCEEDED = 3;
  CELL_CONTROL_OPERATION_STATE_V1_FAILED = 4;
  CELL_CONTROL_OPERATION_STATE_V1_CANCELLED = 5;
  CELL_CONTROL_OPERATION_STATE_V1_CANCEL_REQUESTED = 6;
}

enum CellControlOperationStepV1 {
  CELL_CONTROL_OPERATION_STEP_V1_UNSPECIFIED = 0;
  CELL_CONTROL_OPERATION_STEP_V1_ACCEPTED = 1;
  CELL_CONTROL_OPERATION_STEP_V1_RECONCILING_RESOURCE = 2;
  CELL_CONTROL_OPERATION_STEP_V1_VALIDATING_PROMOTION = 3;
  CELL_CONTROL_OPERATION_STEP_V1_REJECTING_NEW_ADMISSIONS = 4;
  CELL_CONTROL_OPERATION_STEP_V1_RELOCATING_BINDINGS = 5;
  CELL_CONTROL_OPERATION_STEP_V1_PROVING_ZERO_RESIDUE = 6;
  CELL_CONTROL_OPERATION_STEP_V1_DECOMMISSIONING = 7;
  CELL_CONTROL_OPERATION_STEP_V1_SELECTING_MOVES = 8;
  CELL_CONTROL_OPERATION_STEP_V1_EXECUTING_MOVES = 9;
  CELL_CONTROL_OPERATION_STEP_V1_TERMINAL = 10;
}

enum CellControlCancellationDispositionV1 {
  CELL_CONTROL_CANCELLATION_DISPOSITION_V1_UNSPECIFIED = 0;
  CELL_CONTROL_CANCELLATION_DISPOSITION_V1_CANCELLABLE = 1;
  CELL_CONTROL_CANCELLATION_DISPOSITION_V1_STOP_NEW_WORK_AND_CONVERGE = 2;
  CELL_CONTROL_CANCELLATION_DISPOSITION_V1_FORWARD_RECOVERY_REQUIRED = 3;
  CELL_CONTROL_CANCELLATION_DISPOSITION_V1_TERMINAL = 4;
}

enum CellControlOperationFailureCodeV1 {
  CELL_CONTROL_OPERATION_FAILURE_CODE_V1_UNSPECIFIED = 0;
  CELL_CONTROL_OPERATION_FAILURE_CODE_V1_DEPENDENCY_UNAVAILABLE = 1;
  CELL_CONTROL_OPERATION_FAILURE_CODE_V1_INTEGRITY_FAILURE = 2;
  CELL_CONTROL_OPERATION_FAILURE_CODE_V1_AUDIT_PERSISTENCE_FAILED = 3;
  CELL_CONTROL_OPERATION_FAILURE_CODE_V1_EVIDENCE_UNAVAILABLE = 4;
  CELL_CONTROL_OPERATION_FAILURE_CODE_V1_CAPACITY_EXHAUSTED = 5;
  CELL_CONTROL_OPERATION_FAILURE_CODE_V1_DEADLINE_EXCEEDED = 6;
  CELL_CONTROL_OPERATION_FAILURE_CODE_V1_FORWARD_RECOVERY_REQUIRED = 7;
  CELL_CONTROL_OPERATION_FAILURE_CODE_V1_OPERATOR_INTERVENTION_REQUIRED = 8;
}

message CellControlOperationFailureV1 {
  CellControlOperationFailureCodeV1 code = 1;
  bool retryable = 2;
  Digest32 details_digest = 3;
}

message CellControlOperationOutcomeV1 {
  oneof outcome {
    CellViewV1 cell = 1;
    DrainProofLedgerV1 drain_ledger = 2;
    RebalanceJobV1 rebalance_job = 3;
  }
}

message CellControlOperationV1 {
  CellControlOperationKeyV1 key = 1;
  CellControlOperationKindV1 kind = 2;
  CellControlOperationStateV1 state = 3;
  CellControlOperationStepV1 step = 4;
  uint64 revision = 5;
  Digest32 durable_checkpoint_digest = 6;
  CellControlOperationOutcomeV1 outcome = 7;
  CellControlOperationFailureV1 failure = 8;
  uint64 created_at_unix_seconds = 9;
  uint64 updated_at_unix_seconds = 10;
  Digest32 record_digest = 11;
  CellControlCancellationDispositionV1 cancellation = 12;
}
