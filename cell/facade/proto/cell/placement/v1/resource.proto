syntax = "proto3";

package cell.placement.v1;

import "cell/placement/v1/assurance.proto";
import "cell/placement/v1/capacity.proto";
import "cell/placement/v1/evidence.proto";
import "cell/placement/v1/lifecycle.proto";
import "cell/placement/v1/proof.proto";
import "cell/placement/v1/topology.proto";

// Messages in this file that a write set names as a proposed successor are
// governed by the ownership rule stated at the head of
// cell/placement/v1/movement_authority.proto: the store derives every value it
// owns and refuses a disagreeing proposal, and the scope is every owner-owned
// or store-derived value a proposal restates -- a field, a nested record or a
// whole row -- not a list.
//
// The refusal an adapter must raise is part of the rule and is restated here so
// this pointer is not half of it: PlacementContractError
// PROPOSED_SUCCESSOR_MISMATCH on the store that owns the row, with
// PlacementContractError CONFLICT for an ordinary stale precondition. Both fire
// on the same lost race and their remedies are opposite, so the check order is
// part of the rule too: preconditions are compared FIRST, and
// PROPOSED_SUCCESSOR_MISMATCH is raised only when every precondition holds and
// a restated store-derived value still disagrees.

message CellTopologyInventoryV1 {
  ImmutableEvidenceRefV1 source = 1;
  reserved 2;
  reserved "domains";
  Digest32 ordered_domain_root_digest = 3;
  uint64 domain_count = 4;
  Digest32 ordered_correlation_set_root_digest = 5;
  uint64 correlation_set_count = 6;
  Digest32 inventory_digest = 7;
}

message CellTopologyDomainMemberV1 {
  uint64 ordinal = 1;
  TopologyDomainRefV1 domain = 2;
  Digest32 member_digest = 3;
  repeated Digest32 inclusion_path = 4;
}

message CellTopologyPageRequestV1 {
  CellTopologyInventoryV1 inventory = 1;
  uint32 page_size = 2;
  bytes page_token = 3;
  uint32 maximum_inclusion_path_depth = 4;
}

message CellTopologyPageV1 {
  repeated CellTopologyDomainMemberV1 domains = 1;
  bytes next_page_token = 2;
}

message CellCapabilityInventoryV1 {
  ImmutableEvidenceRefV1 source = 1;
  Digest32 required_capability_root_digest = 2;
  uint64 required_capability_count = 3;
  Digest32 available_capability_root_digest = 4;
  uint64 available_capability_count = 5;
  Digest32 coverage_proof_digest = 6;
  Digest32 inventory_digest = 7;
}

message CellIdentityV1 {
  CellId cell_id = 1;
  PlacementPartitionV1 partition = 2;
  string deployment_unit_id = 3;
  Digest32 identity_digest = 4;
}

message CellSpecV1 {
  reserved 1, 2, 3;
  reserved "cell_id", "partition", "deployment_unit_id";
  CellTopologyInventoryV1 topology = 4;
  ResilienceObjectiveV1 resilience_objective = 5;
  CapacityVectorV1 declared_capacity = 6;
  repeated IsolationClassV1 isolation_classes = 7;
  repeated HardwareClassV1 hardware_classes = 8;
  Digest32 certification_root_digest = 9;
  uint64 certification_count = 10;
  CellCapabilityInventoryV1 capabilities = 11;
  Digest32 spec_digest = 12;
}

enum CellConditionKindV1 {
  CELL_CONDITION_KIND_V1_UNSPECIFIED = 0;
  CELL_CONDITION_KIND_V1_HEALTH = 1;
  CELL_CONDITION_KIND_V1_TOPOLOGY_EVIDENCE_CURRENT = 2;
  CELL_CONDITION_KIND_V1_CAPABILITY_COVERAGE = 3;
  CELL_CONDITION_KIND_V1_CAPACITY_PRESSURE = 4;
  CELL_CONDITION_KIND_V1_DEPLOYMENT_HEALTH = 5;
}

enum CellConditionStatusV1 {
  CELL_CONDITION_STATUS_V1_UNSPECIFIED = 0;
  CELL_CONDITION_STATUS_V1_UNKNOWN = 1;
  CELL_CONDITION_STATUS_V1_FALSE = 2;
  CELL_CONDITION_STATUS_V1_TRUE = 3;
}

message CellConditionV1 {
  CellConditionKindV1 kind = 1;
  CellConditionStatusV1 status = 2;
  string reason_code = 3;
  ImmutableEvidenceRefV1 evidence = 4;
  uint64 observed_at_unix_seconds = 5;
  Digest32 condition_digest = 6;
}

message CellResourceV1 {
  CellSpecV1 spec = 1;
  uint64 spec_revision = 2;
  CellLifecycleRecordV1 lifecycle = 3;
  reserved 4;
  reserved "capacity";
  repeated CellConditionV1 conditions = 5;
  Digest32 ordered_condition_root_digest = 6;
  uint64 condition_count = 7;
  Digest32 resource_digest = 8;
  CellIdentityV1 identity = 9;
}

message CellViewV1 {
  CellResourceV1 resource = 1;
  CellCapacityLedgerV1 capacity = 2;
  Digest32 view_digest = 3;
}

message CellCatalogCandidateV1 {
  CellResourceV1 resource = 1;
  CellAdmissionTermV1 admission_term = 2;
  CapacityVectorV1 reservable_capacity = 3;
  ImmutableEvidenceRefV1 eligibility_evidence = 4;
  Digest32 candidate_digest = 5;
  CellCapacityLedgerV1 capacity = 6;
}

message CellCatalogSnapshotV1 {
  string snapshot_id = 1;
  PlacementPartitionV1 partition = 2;
  uint64 revision = 3;
  Digest32 ordered_candidate_root_digest = 4;
  uint64 candidate_count = 5;
  uint64 observed_at_unix_seconds = 6;
  uint64 expires_at_unix_seconds = 7;
  Digest32 snapshot_digest = 8;
}

message CellCatalogPageRequestV1 {
  PlacementPartitionV1 partition = 1;
  string snapshot_id = 2;
  uint32 page_size = 3;
  bytes page_token = 4;
}

message CellCatalogPageV1 {
  CellCatalogSnapshotV1 snapshot = 1;
  repeated CellCatalogCandidateV1 candidates = 2;
  bytes next_page_token = 3;
}
