syntax = "proto3";

package cell.placement.v1;

// The boundary imports Cell proof types and Tenancy identity only. There is
// deliberately no tenancy/binding import: Tenancy owns binding generation,
// revision, epoch and incarnation, and Cell carries an immutable projection of
// them rather than a reverse dependency on their wire package.
import "cell/placement/v1/proof.proto";
import "tenancy/identity/v1/identity.proto";

enum CapabilityEffectActionV1 {
  CAPABILITY_EFFECT_ACTION_V1_UNSPECIFIED = 0;
  CAPABILITY_EFFECT_ACTION_V1_PREPARE = 1;
  CAPABILITY_EFFECT_ACTION_V1_ACTIVATE = 2;
  CAPABILITY_EFFECT_ACTION_V1_FENCE = 3;
  CAPABILITY_EFFECT_ACTION_V1_WRITE = 4;
  CAPABILITY_EFFECT_ACTION_V1_TRANSFER = 5;
  CAPABILITY_EFFECT_ACTION_V1_RELEASE = 6;
  // Preparation context only; refused under an installed context. It is a
  // distinct action rather than a reuse of RELEASE, which is
  // installed-authority retirement.
  CAPABILITY_EFFECT_ACTION_V1_PREPARATION_CLEANUP = 7;
}

message CapabilityPartitionRefV1 {
  CellId cell = 1;
  string adapter = 2;
  string partition_id = 3;
  Digest32 topology_digest = 4;
  Digest32 transaction_domain_digest = 5;
}

message CapabilityEffectScopeV1 {
  tenancy.identity.v1.TenantId tenant = 1;
  string participant = 2;
  CapabilityPartitionRefV1 partition = 3;
  ProducerIdV1 authority_issuer = 4;
}

message ProjectedServingPartitionRefV1 {
  CellId cell = 1;
  string partition_id = 2;
  Digest32 topology_digest = 3;
}

message InstalledCapabilityAuthorityContextV1 {
  ProjectedServingPartitionRefV1 serving_partition = 1;
  // Independently generated by the owner. Opaque to Cell; compared, never
  // derived from the epoch.
  bytes incarnation = 2;
  uint64 authority_fence = 3;
  uint64 owner_generation = 4;
  uint64 owner_revision = 5;
  Digest32 owner_binding_record_digest = 6;
  Digest32 installation_issuance_digest = 7;
  Digest32 installed_grant_digest = 8;
  Digest32 authority_lease_digest = 9;
  uint64 authority_lease_expires_at_unix_seconds = 10;
}

message CapabilityPreparationContextV1 {
  Digest32 owner_operation_digest = 1;
  Digest32 binding_attempt_digest = 2;
  Digest32 placement_decision_digest = 3;
  Digest32 reservation_commit_permit_digest = 4;
  CapabilityPartitionRefV1 target_partition = 5;
  Digest32 preparation_authority_digest = 6;
  uint64 expires_at_unix_seconds = 7;
}

// Preparation carries no epoch, lease or incarnation field to default. A
// message whose oneof selects preparation but whose bytes carry installed
// defaults is rejected rather than read as a zero epoch.
message CapabilityAuthorityContextV1 {
  oneof context {
    CapabilityPreparationContextV1 preparation = 1;
    InstalledCapabilityAuthorityContextV1 installed = 2;
  }
}

message CapabilityEffectGrantPayloadV1 {
  uint32 schema_version = 1;
  CapabilityEffectScopeV1 scope = 2;
  CapabilityEffectActionV1 action = 3;
  CapabilityAuthorityContextV1 context = 4;
  Digest32 owner_operation_digest = 5;
  Digest32 owner_context_digest = 6;
  Digest32 manifest_digest = 7;
  Digest32 member_digest = 8;
  Digest32 owner_authority_proof_digest = 9;
  string effect_key = 10;
  Digest32 effect_schema_digest = 11;
  Digest32 effect_digest = 12;
  Digest32 acceptance_digest = 13;
  Digest32 audit_policy_digest = 14;
  uint64 maximum_effect_bytes = 15;
  uint64 maximum_effect_cost_microunits = 16;
  string currency = 17;
  Digest32 worker_identity_digest = 18;
  uint64 worker_epoch = 19;
  uint64 not_before_unix_seconds = 20;
  uint64 expires_at_unix_seconds = 21;
}

message SignedCapabilityEffectGrantV1 {
  CapabilityEffectGrantPayloadV1 payload = 1;
  CellProofEnvelopeV1 envelope = 2;
  bytes signature = 3;
}

// Retained without a consumer, matching the Rust type of the same name. An
// expectation is a local verifier input, never trusted wire evidence.
message CapabilityEffectExpectationV1 {
  CapabilityEffectScopeV1 scope = 1;
  CapabilityEffectActionV1 action = 2;
  Digest32 owner_operation_digest = 3;
  Digest32 owner_context_digest = 4;
  Digest32 manifest_digest = 5;
  Digest32 member_digest = 6;
  string effect_key = 7;
  Digest32 effect_schema_digest = 8;
  Digest32 effect_digest = 9;
  Digest32 acceptance_digest = 10;
  ProducerIdV1 expected_audience = 11;
  uint64 now_unix_seconds = 12;
  uint64 maximum_clock_uncertainty_millis = 13;
  // Digest over the canonical encoding of the expected authority context,
  // oneof discriminant included. Appended at 14 rather than placed beside the
  // other digests, so that no existing tag is renumbered.
  Digest32 expected_authority_context_digest = 14;
}

enum LocalAuthorityDispositionV1 {
  LOCAL_AUTHORITY_DISPOSITION_V1_UNSPECIFIED = 0;
  LOCAL_AUTHORITY_DISPOSITION_V1_PREPARED = 1;
  LOCAL_AUTHORITY_DISPOSITION_V1_WRITABLE = 2;
  LOCAL_AUTHORITY_DISPOSITION_V1_FENCED = 3;
  LOCAL_AUTHORITY_DISPOSITION_V1_RELEASED = 4;
}

// Root and count of durable rejection membership the capability store retains
// and verifies. A caller-supplied hash is not a substitute.
message CapabilityAuthorityRejectionHighWaterV1 {
  CapabilityEffectScopeV1 scope = 1;
  uint64 owner_generation = 2;
  Digest32 rejected_instance_root_digest = 3;
  uint64 rejected_instance_count = 4;
  uint64 revision = 5;
  Digest32 record_digest = 6;
}

// Maps the assembled parts of the Rust LocalAuthorityStateV1, whose fields are
// private so that only its assembler mints one.
message LocalAuthorityStateV1 {
  CapabilityEffectScopeV1 scope = 1;
  CapabilityAuthorityContextV1 context = 2;
  LocalAuthorityDispositionV1 disposition = 3;
  CapabilityAuthorityRejectionHighWaterV1 rejection_high_water = 4;
  uint64 revision = 5;
  Digest32 record_digest = 6;
}

message LocalAuthorityPreconditionV1 {
  message Absent {
    CapabilityAuthorityRejectionHighWaterV1 rejection_high_water = 1;
  }

  message Matches {
    uint64 revision = 1;
    Digest32 record_digest = 2;
    CapabilityAuthorityRejectionHighWaterV1 rejection_high_water = 3;
  }

  oneof precondition {
    Absent absent = 1;
    Matches matches = 2;
  }
}

message LocalEffectCommitReceiptPayloadV1 {
  CapabilityEffectScopeV1 scope = 1;
  CapabilityEffectActionV1 action = 2;
  string effect_key = 3;
  Digest32 grant_digest = 4;
  Digest32 request_digest = 5;
  Digest32 effect_digest = 6;
  Digest32 result_digest = 7;
  Digest32 previous_state_digest = 8;
  Digest32 committed_state_digest = 9;
  uint64 commit_revision = 10;
  Digest32 proof_consumption_digest = 11;
  Digest32 idempotency_record_digest = 12;
  Digest32 drain_state_digest = 13;
  Digest32 audit_record_digest = 14;
  uint64 accounted_bytes = 15;
  uint64 accounted_cost_microunits = 16;
  uint64 committed_at_unix_seconds = 17;
  Digest32 rejection_high_water_digest = 18;
  Digest32 authority_context_digest = 19;
  Digest32 adapter_acceptance_digest = 20;
  string currency = 21;
}

message SignedLocalEffectCommitReceiptV1 {
  LocalEffectCommitReceiptPayloadV1 payload = 1;
  CellProofEnvelopeV1 envelope = 2;
  bytes signature = 3;
}

enum CapabilityAdmissionUseV1 {
  CAPABILITY_ADMISSION_USE_V1_UNSPECIFIED = 0;
  CAPABILITY_ADMISSION_USE_V1_INITIAL_BINDING = 1;
  CAPABILITY_ADMISSION_USE_V1_MIGRATION_SOURCE = 2;
  CAPABILITY_ADMISSION_USE_V1_MIGRATION_TARGET = 3;
}

message CapabilityAdapterAcceptancePayloadV1 {
  CapabilityEffectScopeV1 scope = 1;
  CapabilityAdmissionUseV1 use_case = 2;
  Digest32 adapter_binary_digest = 3;
  Digest32 adapter_configuration_digest = 4;
  Digest32 store_schema_digest = 5;
  Digest32 transaction_domain_digest = 6;
  Digest32 effect_schema_digest = 7;
  uint64 deployment_admission_epoch = 8;
  Digest32 writable_inventory_digest = 9;
  Digest32 conformance_suite_digest = 10;
  Digest32 conformance_result_digest = 11;
  repeated CapabilityEffectActionV1 supported_actions = 12;
  uint64 expires_at_unix_seconds = 13;
}

message SignedCapabilityAdapterAcceptanceV1 {
  CapabilityAdapterAcceptancePayloadV1 payload = 1;
  CellProofEnvelopeV1 envelope = 2;
  bytes signature = 3;
}

message CapabilityReceiptQueryV1 {
  CapabilityEffectScopeV1 scope = 1;
  string effect_key = 2;
  Digest32 request_digest = 3;
}

// Read-only. Its window is authenticated independently of the effect grant, so
// an expired or fenced grant still permits retrieval and a revoked principal
// still does not. It can authorize no mutation and cannot refresh a grant.
message CapabilityReceiptRecoveryPayloadV1 {
  CapabilityReceiptQueryV1 query = 1;
  Digest32 principal_digest = 2;
  Digest32 authorization_decision_digest = 3;
  ProducerIdV1 expected_receipt_audience = 4;
  uint64 not_before_unix_seconds = 5;
  uint64 expires_at_unix_seconds = 6;
}

message SignedCapabilityReceiptRecoveryV1 {
  CapabilityReceiptRecoveryPayloadV1 payload = 1;
  CellProofEnvelopeV1 envelope = 2;
  bytes signature = 3;
}

// The unsigned payload the capability's physical transaction durably holds.
// Commit returns this; it never returns a publication signature.
message DurableLocalEffectReceiptV1 {
  CapabilityReceiptQueryV1 query = 1;
  LocalEffectCommitReceiptPayloadV1 payload = 2;
  Digest32 payload_digest = 3;
  uint64 local_record_revision = 4;
}

// What a storage commit observer read back under committed read isolation.
// Its signing identity is limited to this assertion.
message LocalEffectReceiptCommitObservationV1 {
  CapabilityReceiptQueryV1 query = 1;
  Digest32 payload_digest = 2;
  uint64 local_record_revision = 3;
  Digest32 authority_state_digest = 4;
  Digest32 rejection_high_water_digest = 5;
  Digest32 effect_result_digest = 6;
  Digest32 proof_consumption_digest = 7;
  Digest32 idempotency_record_digest = 8;
  Digest32 drain_state_digest = 9;
  Digest32 audit_record_digest = 10;
  Digest32 adapter_acceptance_digest = 11;
}

message SignedLocalEffectReceiptCommitObservationV1 {
  LocalEffectReceiptCommitObservationV1 payload = 1;
  CellProofEnvelopeV1 envelope = 2;
  bytes signature = 3;
}

// A claim, not evidence. Only the Cell verifier turns this into the private
// wrapper the publisher accepts; the wrapper itself is never a wire type, and
// neither is the capability's local effect type.
message CommittedLocalEffectReceiptClaimV1 {
  DurableLocalEffectReceiptV1 durable = 1;
  SignedLocalEffectReceiptCommitObservationV1 observation = 2;
}
