syntax = "proto3";

package cell.placement.v1;

import "cell/placement/v1/drain.proto";
import "cell/placement/v1/proof.proto";

// Messages in this file that a write set names as a proposed successor are
// governed by the ownership rule stated at the head of
// cell/placement/v1/movement_authority.proto: the store derives every value it
// owns and refuses a disagreeing proposal, and the scope is every owner-owned
// or store-derived value a proposal restates -- a field, a nested record or a
// whole row -- not a list.
//
// The refusal an adapter must raise is part of the rule and is restated here so
// this pointer is not half of it: PlacementContractError
// PROPOSED_SUCCESSOR_MISMATCH on the store that owns the row, with
// PlacementContractError CONFLICT for an ordinary stale precondition. Both fire
// on the same lost race and their remedies are opposite, so the check order is
// part of the rule too: preconditions are compared FIRST, and
// PROPOSED_SUCCESSOR_MISMATCH is raised only when every precondition holds and
// a restated store-derived value still disagrees.
//
// DrainContributorStateV1 IS AN EXCEPTION TO THAT ONE REFUSAL NAME, and the
// exception is stated rather than left to be inferred. Cell states the
// contributor vocabulary (DrainContributorKindV1) and owns the shape of the
// row; each CONTRIBUTOR writes its own contributor row, in its own store, under
// its own error taxonomy. Six Tenancy write sets carry
// DrainContributorStateMutationV1 or DrainContributorMutationSetV1 --
// BindingControlPartitionMutationPartsV1, BindingProjectionInstallWriteSetPartsV1
// and the four capability write sets -- and every store that applies them
// returns BindingStoreError, never PlacementContractError. For a disagreeing
// proposal on that path the refusal is BindingStoreError
// PROPOSED_SUCCESSOR_MISMATCH, with BindingStoreError CONFLICT for an ordinary
// stale read, in the check order stated at the head of
// tenancy/binding/v1/serving_authority.proto.
//
// Which refusal applies is decided by WHICH STORE APPLIES THE MUTATION, not by
// which package declares the message. An adapter reading only the sentence
// above would look for a PlacementContractError variant on a Tenancy store and
// find that it cannot be returned there at all.

enum DrainContributorStateDispositionV1 {
  DRAIN_CONTRIBUTOR_STATE_DISPOSITION_V1_UNSPECIFIED = 0;
  DRAIN_CONTRIBUTOR_STATE_DISPOSITION_V1_OPEN = 1;
  DRAIN_CONTRIBUTOR_STATE_DISPOSITION_V1_SEALED = 2;
}

message DrainContributorStateV1 {
  CellId cell_id = 1;
  DrainContributorKindV1 contributor_kind = 2;
  string contributor_id = 3;
  DrainContributorStateDispositionV1 disposition = 4;
  optional uint64 drain_term = 5;
  uint64 state_creation_high_water = 6;
  Digest32 state_root_digest = 7;
  uint64 state_count = 8;
  uint64 revision = 9;
  Digest32 record_digest = 10;
}

// Compare-and-set on the contributor state row, DrainContributorStateV1.
//
// The absent arm is not optional decoration: DRAIN_CONTRIBUTOR_MUTATION_KIND_V1
// _CREATE opens the row, and at that mutation there is no prior revision and no
// prior record digest to pin. An adapter reading only the present arm would
// have to invent both to perform the first write. The refusal when an arm's
// assertion is false is PlacementContractError CONFLICT -- a PRECONDITION that
// did not hold, checked before any proposal is compared, so it is CONFLICT and
// not PROPOSED_SUCCESSOR_MISMATCH.
message DrainContributorMutationPreconditionV1 {
  message Absent {
    CellId cell_id = 1;
    string contributor_id = 2;
  }

  message Present {
    CellId cell_id = 1;
    string contributor_id = 2;
    DrainContributorStateDispositionV1 expected_disposition = 3;
    uint64 expected_revision = 4;
    Digest32 expected_record_digest = 5;
  }

  oneof arm {
    Absent absent = 1;
    Present present = 2;
  }
}

enum DrainContributorMutationKindV1 {
  DRAIN_CONTRIBUTOR_MUTATION_KIND_V1_UNSPECIFIED = 0;
  DRAIN_CONTRIBUTOR_MUTATION_KIND_V1_CREATE = 1;
  DRAIN_CONTRIBUTOR_MUTATION_KIND_V1_UPDATE_WHILE_OPEN = 2;
  DRAIN_CONTRIBUTOR_MUTATION_KIND_V1_CLEANUP = 3;
}

enum DrainContributorSubjectRelationKindV1 {
  DRAIN_CONTRIBUTOR_SUBJECT_RELATION_KIND_V1_UNSPECIFIED = 0;
  DRAIN_CONTRIBUTOR_SUBJECT_RELATION_KIND_V1_ABSENT = 1;
  DRAIN_CONTRIBUTOR_SUBJECT_RELATION_KIND_V1_PRESENT = 2;
}

message DrainContributorSubjectRelationV1 {
  DrainContributorSubjectRelationKindV1 relation_kind = 1;
  Digest32 subject_digest = 2;
  Digest32 expected_state_root_digest = 3;
  repeated Digest32 relation_proof_path = 4;
  Digest32 relation_digest = 5;
}

message DrainContributorStateMutationV1 {
  DrainContributorMutationPreconditionV1 precondition = 1;
  DrainContributorStateV1 next_state = 2;
  DrainContributorMutationKindV1 mutation_kind = 3;
  DrainContributorSubjectRelationV1 subject_relation = 4;
  Digest32 mutation_digest = 5;
}

message DrainContributorMutationSetV1 {
  repeated DrainContributorStateMutationV1 mutations = 1;
  Digest32 ordered_mutation_root_digest = 2;
  uint64 mutation_count = 3;
  Digest32 ordered_subject_relation_root_digest = 4;
  Digest32 set_digest = 5;
}

message DrainContributorSealIntentV1 {
  uint32 schema_version = 1;
  CellId cell_id = 2;
  uint64 drain_term = 3;
  Digest32 manifest_digest = 4;
  DrainContributorKindV1 contributor_kind = 5;
  string contributor_id = 6;
  uint64 sealed_state_revision = 7;
  uint64 sealed_state_creation_high_water = 8;
  Digest32 sealed_state_root_digest = 9;
  uint64 sealed_state_count = 10;
  Digest32 sealed_state_record_digest = 11;
  Digest32 intent_digest = 12;
}

// What an INDEPENDENT commit observer read for one contributor seal, by
// re-reading the committed row. Signed under
// CELL_PROOF_DOMAIN_V1_DRAIN_CONTRIBUTOR_SEAL_COMMIT_OBSERVATION by the
// observer's own identity, never by the store that performed the seal.
message DrainContributorSealCommitObservationV1 {
  uint32 schema_version = 1;
  Digest32 seal_intent_digest = 2;
  uint64 sealed_state_revision = 3;
  Digest32 sealed_state_record_digest = 4;
  Digest32 committed_transaction_digest = 5;
  // Read out of the durable record.
  uint64 committed_at_unix_seconds = 6;
  // When the observer itself looked.
  uint64 observed_at_unix_seconds = 7;
}

message SignedDrainContributorSealCommitObservationV1 {
  DrainContributorSealCommitObservationV1 payload = 1;
  CellProofEnvelopeV1 envelope = 2;
  bytes signature = 3;
}

message DrainContributorSealPayloadV1 {
  uint32 schema_version = 1;
  DrainContributorSealIntentV1 intent = 2;
  SignedDrainContributorSealCommitObservationV1 commit_observation = 3;
  Digest32 seal_digest = 4;
}

message SignedDrainContributorSealV1 {
  DrainContributorSealPayloadV1 payload = 1;
  CellProofEnvelopeV1 envelope = 2;
  bytes signature = 3;
}
