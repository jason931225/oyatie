syntax = "proto3";

package cell.placement.v1;

import "cell/placement/v1/assurance.proto";
import "cell/placement/v1/capacity.proto";
import "cell/placement/v1/economics.proto";
import "cell/placement/v1/evidence.proto";
import "cell/placement/v1/proof.proto";
import "cell/placement/v1/topology.proto";
import "tenancy/identity/v1/identity.proto";

message PlacementSearchCursorV1 {
  uint64 next_partition_ordinal = 1;
  uint64 next_window_ordinal = 2;
  string opaque_token = 3;
  Digest32 exhaustion_accumulator_digest = 4;
  uint64 next_candidate_ordinal = 5;
  uint64 evaluated_candidate_count = 6;
  Digest32 current_best_candidate_digest = 7;
  Digest32 current_best_score_digest = 8;
  PlacementBestCandidateV1 current_best = 9;
}

message PlacementSearchPlanV1 {
  string catalog_snapshot_id = 1;
  Digest32 ordered_partition_root_digest = 2;
  uint64 partition_count = 3;
  uint32 maximum_candidates_per_window = 4;
  uint32 maximum_windows_per_step = 5;
  uint32 maximum_windows_per_reconciliation_lease = 6;
  PlacementSearchCursorV1 cursor = 7;
  Digest32 plan_digest = 8;
  Digest32 ordered_candidate_root_digest = 9;
  uint64 candidate_count = 10;
}

message PlacementIncumbentV1 {
  CellId cell_id = 1;
  uint64 binding_generation = 2;
  uint64 binding_revision = 3;
  Digest32 binding_digest = 4;
}

enum PlacementIntentPurposeV1 {
  PLACEMENT_INTENT_PURPOSE_V1_UNSPECIFIED = 0;
  PLACEMENT_INTENT_PURPOSE_V1_INITIAL_ADMISSION = 1;
  PLACEMENT_INTENT_PURPOSE_V1_EXPLICIT_MIGRATION = 2;
  PLACEMENT_INTENT_PURPOSE_V1_DRAIN = 3;
  PLACEMENT_INTENT_PURPOSE_V1_RECOVERY = 4;
  PLACEMENT_INTENT_PURPOSE_V1_DEPLOYMENT_POLICY = 5;
  PLACEMENT_INTENT_PURPOSE_V1_SUSTAINED_CAPACITY_BAND_CROSSING = 6;
}

message PlacementIntentPayloadV1 {
  uint32 schema_version = 1;
  PlacementOperationKeyV1 operation = 2;
  tenancy.identity.v1.TenantId tenant_id = 3;
  SignedAssuranceCompilationV1 assurance_compilation = 4;
  CapacityVectorV1 home_capacity = 5;
  ResilienceObjectiveV1 resilience = 6;
  PlacementIncumbentV1 incumbent = 7;
  reserved 8;
  reserved "search";
  CapacityPurchasePreferenceV1 capacity_purchase_preference = 9;
  PlacementIntentPurposeV1 purpose = 10;
  Digest32 movement_authority_digest = 11;
}

message SignedPlacementIntentV1 {
  PlacementIntentPayloadV1 payload = 1;
  CellProofEnvelopeV1 envelope = 2;
  bytes signature = 3;
}

message DominantResourceUtilizationV1 {
  CapacityDimensionV1 dimension = 1;
  uint32 post_placement_utilization_millionths = 2;
}

enum PlacementScoreOrderV1 {
  PLACEMENT_SCORE_ORDER_V1_UNSPECIFIED = 0;
  PLACEMENT_SCORE_ORDER_V1_DOMINANT_UTILIZATION_THEN_CORRELATED_RISK_THEN_MOVEMENT_THEN_MARGINAL_COST_THEN_STABLE_HASH = 1;
}

message PlacementScoreV1 {
  reserved 1 to 3;
  reserved "weights", "components", "checked_weighted_total";
  CommercialPlacementBasisV1 commercial_basis = 4;
  Digest32 stable_tie_break_digest = 5;
  MoneyMicrounitsV1 raw_marginal_cost = 6;
  MoneyMicrounitsV1 risk_adjusted_marginal_cost = 7;
  DominantResourceUtilizationV1 dominant_resource_utilization = 8;
  uint32 correlated_risk_overlap_millionths = 9;
  uint64 data_movement_bytes = 10;
  Digest32 ordered_score_digest = 11;
  Digest32 correlated_risk_evidence_digest = 12;
  Digest32 data_movement_cost_digest = 13;
  PlacementScoreOrderV1 order = 14;
}

message PlacementBestCandidateV1 {
  CellId cell_id = 1;
  PlacementPartitionV1 partition = 2;
  uint64 candidate_ordinal = 3;
  Digest32 candidate_digest = 4;
  Digest32 admission_term_digest = 5;
  uint64 capacity_revision = 6;
  Digest32 capacity_record_digest = 7;
  PlacementScoreV1 score = 8;
  Digest32 accumulator_digest = 9;
}

message PlacementAllocationV1 {
  CellId cell_id = 1;
  PlacementPartitionV1 partition = 2;
  ReservationRefV1 reservation = 3;
  Digest32 eligibility_proof_digest = 4;
  Digest32 failure_independence_proof_digest = 5;
  Digest32 post_placement_headroom_digest = 6;
  CommercialAllocationAttributionV1 commercial_attribution = 7;
}

message PlacementDecisionPayloadV1 {
  uint32 schema_version = 1;
  PlacementOperationKeyV1 operation = 2;
  tenancy.identity.v1.TenantId tenant_id = 3;
  uint64 policy_generation = 4;
  uint64 assurance_generation = 5;
  string assurance_compiler_version = 6;
  Digest32 intent_proof_digest = 7;
  Digest32 search_plan_digest = 8;
  PlacementAllocationV1 home = 9;
  PlacementAllocationV1 warm_recovery = 10;
  PlacementScoreV1 score = 11;
  Digest32 assurance_requirements_digest = 12;
  Digest32 assurance_evidence_digest = 13;
  Digest32 recovery_evidence_digest = 14;
  SignedAssuranceEvidenceV1 assurance_evidence = 15;
  SignedRecoveryEvidenceV1 recovery_evidence = 16;
  Digest32 assurance_compilation_digest = 17;
}

message SignedPlacementDecisionV1 {
  PlacementDecisionPayloadV1 payload = 1;
  CellProofEnvelopeV1 envelope = 2;
  bytes signature = 3;
}

message PlacementContinuationPayloadV1 {
  uint32 schema_version = 1;
  PlacementOperationKeyV1 operation = 2;
  tenancy.identity.v1.TenantId tenant_id = 3;
  uint64 policy_generation = 4;
  Digest32 search_plan_digest = 5;
  PlacementSearchCursorV1 next_cursor = 6;
  uint64 evaluated_windows_total = 7;
  uint64 evaluated_candidate_count = 8;
}

message SignedPlacementContinuationV1 {
  PlacementContinuationPayloadV1 payload = 1;
  CellProofEnvelopeV1 envelope = 2;
  bytes signature = 3;
}

message PlacementExhaustionPayloadV1 {
  uint32 schema_version = 1;
  PlacementOperationKeyV1 operation = 2;
  tenancy.identity.v1.TenantId tenant_id = 3;
  uint64 policy_generation = 4;
  Digest32 search_plan_digest = 5;
  Digest32 ordered_partition_root_digest = 6;
  uint64 partition_count = 7;
  uint64 evaluated_partition_count = 8;
  uint64 evaluated_windows_total = 9;
  Digest32 exhaustion_accumulator_digest = 10;
  reserved 11;
  reserved "complete";
  Digest32 ordered_candidate_root_digest = 12;
  uint64 candidate_count = 13;
  uint64 evaluated_candidate_count = 14;
  PlacementSearchCursorV1 terminal_cursor = 15;
}

message SignedPlacementExhaustionV1 {
  PlacementExhaustionPayloadV1 payload = 1;
  CellProofEnvelopeV1 envelope = 2;
  bytes signature = 3;
}
