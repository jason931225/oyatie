# Required presubmit context; provenance ADR-0719 D-9/D-10.
name: presubmit
on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  pull-requests: read
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
jobs:
  layout:
    name: repository layout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Check out protected admission source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "nightly-2026-09-10"
      - name: Build protected path-layout application
        working-directory: ${{ runner.temp }}
        run: >-
          cargo build --locked
          --manifest-path "$GITHUB_WORKSPACE/trusted/Cargo.toml"
          --target x86_64-unknown-linux-gnu
          --target-dir "$RUNNER_TEMP/oyatie-layout-admission"
          -p pipeline-path-layout-app
      - name: Admit candidate tree
        working-directory: candidate
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse --verify 'HEAD^1^{commit}')"
          head_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          "$RUNNER_TEMP/oyatie-layout-admission/x86_64-unknown-linux-gnu/debug/pipeline-path-layout-app" "$base_sha" "$head_sha"
  occupancy:
    name: occupancy (path-set)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Check out protected admission source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "nightly-2026-09-10"
      - name: Build path occupancy application
        working-directory: ${{ runner.temp }}
        run: >-
          cargo build --locked
          --manifest-path "$GITHUB_WORKSPACE/trusted/Cargo.toml"
          --target x86_64-unknown-linux-gnu
          --target-dir "$RUNNER_TEMP/oyatie-occupancy-admission"
          -p pipeline-path-occupancy-app
      - name: Admit complete Git path-set
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          OYATIE_PULL_REQUEST: ${{ github.event.pull_request.number }}
          OYATIE_REPOSITORY: ${{ github.repository }}
        run: "$RUNNER_TEMP/oyatie-occupancy-admission/x86_64-unknown-linux-gnu/debug/pipeline-path-occupancy-app"
  lint:
    name: lint (format)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with: { toolchain: "nightly-2026-09-10", components: rustfmt }
      - name: Check formatting
        working-directory: ${{ runner.temp }}
        run: >-
          cargo fmt
          --manifest-path "$GITHUB_WORKSPACE/Cargo.toml"
          --all --check
  clippy:
    name: clippy (workspace)
    needs: [layout]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with: { toolchain: "nightly-2026-09-10", components: clippy }
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with: { shared-key: cargo-ci-x86, cache-workspace-crates: "true" }
      - name: Workspace clippy
        run: >-
          cargo clippy --locked --workspace --all-targets
          -- -D warnings
  deny:
    needs: [layout]
    uses: oyatie/oyatie/.github/workflows/dependency-denial.yml@dev
  commit-signing:
    needs: [layout]
    uses: oyatie/oyatie/.github/workflows/commit-signing.yml@dev
    permissions: {contents: read}
  test:
    name: test (workspace)
    needs: [layout, occupancy]
    if: always() && needs.layout.result == 'success' && (needs.occupancy.result == 'success' || needs.occupancy.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with: { toolchain: "nightly-2026-09-10" }
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with: { tool: nextest }
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with: { shared-key: cargo-ci-x86, cache-workspace-crates: "true" }
      - name: Workspace tests
        run: >-
          cargo-nextest nextest run
          --manifest-path "$GITHUB_WORKSPACE/Cargo.toml"
          --locked --workspace --profile ci
  reindeer-source-qualification:
    name: Reindeer source qualification
    needs: [layout, change-gates]
    if: needs.layout.result == 'success' && needs.change-gates.outputs.reindeer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out candidate tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Acquire immutable Reindeer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: facebookincubator/reindeer
          ref: bb681570d2bc47d1446080c12b8681a50a95f628
          path: reindeer-source
          persist-credentials: false
          fetch-depth: 1
      - name: Validate immutable Reindeer source
        working-directory: reindeer-source
        run: |
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "bb681570d2bc47d1446080c12b8681a50a95f628"
          test "$(git rev-parse 'HEAD^{tree}')" = "153f32a846b5e1f460e61fff1cecbbf5177c8c90"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with: { toolchain: "nightly-2026-05-22", components: "clippy" }
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with: { toolchain: "nightly-2026-09-10" }
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with: { tool: nextest }
      - name: Restore exact qualification inputs and compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/reindeer-qualification
          key: reindeer-qualification-v1-${{ runner.os }}-rust-nightly-2026-09-10-${{ github.sha }}-d4644db6bee4fce06425c6802dfc5b3c2d2a12ba93ea3d635e076700bc34d614-${{ hashFiles('Cargo.lock', 'reindeer-source/Cargo.lock') }}
      - name: Acquire locked Cargo inputs
        env:
          CARGO_HOME: ${{ runner.temp }}/reindeer-qualification/cargo-home
        run: |
          timeout --signal=TERM --kill-after=30s 10m cargo fetch --locked --manifest-path "$GITHUB_WORKSPACE/Cargo.toml"
          timeout --signal=TERM --kill-after=30s 10m cargo fetch --locked --manifest-path "$GITHUB_WORKSPACE/reindeer-source/Cargo.toml"
      - name: Qualify the real pinned Reindeer source
        env:
          CARGO_HOME: ${{ runner.temp }}/reindeer-qualification/cargo-home
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/reindeer-qualification/compilation/workspace
          REINDEER_PINNED_BUCK_RS: ${{ github.workspace }}/reindeer-source/src/buck.rs
          REINDEER_PINNED_SOURCE_ROOT: ${{ github.workspace }}/reindeer-source
          REINDEER_QUALIFICATION_TARGET_DIR: ${{ runner.temp }}/reindeer-qualification/compilation/upstream
        run: timeout --signal=TERM --kill-after=30s 40m cargo-nextest nextest run --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --locked -p dependency-declarations-generation-reindeer --profile ci --run-ignored only --no-tests=fail --test-threads 1 --max-fail 1:immediate
  change-gates:
    name: change gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      backbone_postgres: ${{ steps.g.outputs.backbone_postgres }}
      compute_lifecycle_postgres: ${{ steps.g.outputs.compute_lifecycle_postgres }}
      reindeer: ${{ steps.g.outputs.reindeer }}
    steps:
      - name: Check out candidate tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Check out protected admission source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "nightly-2026-09-10"
      - name: Build protected change-gates application
        working-directory: ${{ runner.temp }}
        run: >-
          cargo build --locked
          --manifest-path "$GITHUB_WORKSPACE/trusted/Cargo.toml"
          --target x86_64-unknown-linux-gnu
          --target-dir "$RUNNER_TEMP/oyatie-change-gates-admission"
          -p pipeline-change-gates-app
      - id: g
        name: Classify typed qualification paths
        working-directory: candidate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse --verify 'HEAD^1^{commit}')"
          head_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          "$RUNNER_TEMP/oyatie-change-gates-admission/x86_64-unknown-linux-gnu/debug/pipeline-change-gates-app" "$EVENT" "$base_sha" "$head_sha" >> "$GITHUB_OUTPUT"
  live-postgres:
    needs: [layout, change-gates]
    if: needs.layout.result == 'success' && !(needs.change-gates.outputs.backbone_postgres == 'false' && needs.change-gates.outputs.compute_lifecycle_postgres == 'false')
    uses: oyatie/oyatie/.github/workflows/live-postgres.yml@dev
    with:
      run_backbone: ${{ needs.change-gates.outputs.backbone_postgres == 'true' }}
      run_compute_lifecycle: ${{ needs.change-gates.outputs.compute_lifecycle_postgres == 'true' }}
  build-cache-qualification:
    needs: [layout]
    permissions: {contents: read}
    uses: oyatie/oyatie/.github/workflows/build-cache-qualification.yml@dev
  presubmit:
    name: presubmit
    runs-on: ubuntu-24.04
    if: always()
    needs: [layout, occupancy, lint, clippy, test, deny, change-gates, commit-signing, reindeer-source-qualification, live-postgres, build-cache-qualification]
    steps:
      - name: Fan-in verdict
        env:
          BACKBONE_POSTGRES: ${{ needs.change-gates.outputs.backbone_postgres }}
          COMPUTE_LIFECYCLE_POSTGRES: ${{ needs.change-gates.outputs.compute_lifecycle_postgres }}
          REINDEER: ${{ needs.change-gates.outputs.reindeer }}
          EVENT: ${{ github.event_name }}
        run: |
          req() { [ "$1" = "success" ]; }
          gate() { [ "$1" = "true" ] || [ "$1" = "false" ]; }
          pg() {
            if [ "${BACKBONE_POSTGRES}" = "true" ] || [ "${COMPUTE_LIFECYCLE_POSTGRES}" = "true" ]; then [ "$1" = "success" ]; else [ "$1" = "skipped" ] || [ "$1" = "success" ]; fi
          }
          reindeer() {
            if [ "${REINDEER}" = "true" ]; then [ "$1" = "success" ]; else [ "$1" = "skipped" ] || [ "$1" = "success" ]; fi
          }
          occ() {
            if [ "${EVENT}" = "pull_request" ]; then [ "$1" = "success" ]; else [ "$1" = "skipped" ] || [ "$1" = "success" ]; fi
          }
          gate "${BACKBONE_POSTGRES}" && gate "${COMPUTE_LIFECYCLE_POSTGRES}" && gate "${REINDEER}" && req "${{ needs.layout.result }}" && occ "${{ needs.occupancy.result }}" && req "${{ needs.lint.result }}" && req "${{ needs.clippy.result }}" && req "${{ needs.test.result }}" && req "${{ needs.deny.result }}" && req "${{ needs.change-gates.result }}" && occ "${{ needs.commit-signing.result }}" && reindeer "${{ needs.reindeer-source-qualification.result }}" && pg "${{ needs.live-postgres.result }}" && req "${{ needs.build-cache-qualification.result }}" && exit 0 || exit 1
