# TAP nightly (ADR-0719 D-10): arm64 nextest. Not a required context.
name: nightly

on:
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nextest-arm64:
    name: nextest (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "nightly-2026-09-10"
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: nextest
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-nightly-arm64
          cache-workspace-crates: "true"
      - name: Workspace tests (arm64)
        run: cargo nextest run --locked --workspace --profile ci
