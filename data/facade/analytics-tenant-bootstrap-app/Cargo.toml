[package]
name = "data-analytics-tenant-bootstrap-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Tenant bootstrap controller: creates the per-tenant OLAP database on tenant-created and drops it on tenant-deleted; suspended and reactivated return Unimplemented (IP-002). The binary wires the ClickHouse adapter; the event consumer is not yet wired."

[package.metadata.oyatie]
microservice = "analytics"
bounded_context = "analytics-tenant-bootstrap"
layer = "app"
owner_team = "council-analytics"
adr_anchors = ["ADR-0083", "ADR-0145", "ADR-0193", "ADR-0155", "ADR-0038"]
ip_anchor = "IP-002"
container_image = "ghcr.io/oyatie/analytics-tenant-bootstrap:<sha> (non_claim: not yet built)"
data_classification = "INTERNAL_ONLY"

[lib]
doctest = false

[dependencies]
shared-olap-clickhouse-adapter = { path = "../../adapters/olap-clickhouse" }
shared-olap-client-kernel = { path = "../../core/olap-client-kernel" }
data-analytics-domain = { path = "../../core/analytics-domain" }


serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true
